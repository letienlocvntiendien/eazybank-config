# Global config served to every service when the active profile is "default"
# (that is what docker-compose sets via SPRING_PROFILES_ACTIVE=default).
# Not served for the prod/qa profiles used when running locally, so local runs
# keep the localhost value from each service's own application.properties.
#
# NOTE: eureka.client.serviceUrl is a Map<String,String>. Spring's relaxed
# binding does not apply to map KEYS, so this must be written in camelCase --
# "defaultZone" is the only key the Eureka client ever reads.
eureka.client.serviceUrl.defaultZone=http://eurekaserver:8761/eureka/
